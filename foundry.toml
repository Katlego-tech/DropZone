# The Python package owns src/ and tests/, so the Solidity project is pointed at
# contracts/ rather than Foundry's defaults. One toolchain per language, one repo.
[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

# Pinned, like every other dependency here. Floating the compiler means the
# bytecode you audited is not necessarily the bytecode you deploy.
solc = "0.8.30"

# Nothing in this contract needs an opcode newer than Shanghai. Pinning low keeps
# the same bytecode deployable on L2s whose EVM lags mainnet.
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200

# A warning nobody reads is a breakage scheduled for a later date — same policy
# as filterwarnings = ["error"] on the Python side.
deny = "warnings"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
