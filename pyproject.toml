[project]
name = "dropzone"
version = "0.1.0"
description = "Time-limited access passes, bought on-chain and enforced off-chain"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.9.1",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropzone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# A deprecation warning nobody reads is a breakage scheduled for a later date.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Vendored dependencies. The forge-std submodule ships Python scripts of its own,
# and linting somebody else's code produces failures nobody here can act on.
extend-exclude = ["lib"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit: security lints
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/**" = ["S101"]
